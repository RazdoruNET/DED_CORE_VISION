; DED CORE VISION — дисплей-модуль приборки для DED CORE V4.
;
; Плата: JC4827W543 (ESP32-S3-N4R8, 4.3" 480x272 NV3041A QSPI, GT911).
; Модуль — обычный клиент точки доступа ядра: сопряжение по DED_PAIR_*,
; телеметрия по WebSocket на порту 81, портал настройки и OTA.
;
; Сборка:  pio run
; Прошивка: pio run -t upload

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

; 4 МБ QSPI flash + 8 МБ OPI PSRAM (ESP32-S3-WROOM-1-N4R8).
; dio_opi = flash DIO, PSRAM OPI — как в старой сборке Arduino IDE.
board_build.arduino.memory_type = dio_opi
; Без этого define Arduino-ядро не поднимает ps_malloc/psramFound, хотя
; конфиг dio_opi уже собран с CONFIG_SPIRAM. Canvas 480x272 живёт в PSRAM.
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions_vision.csv

monitor_speed = 115200
upload_speed = 921600

build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    ; ElegantOTA в режиме ESPAsyncWebServer: страница обновления на том же сервере.
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1

lib_deps =
    ; Контракт ядра разбирается через StaticJsonBuffer — нужен ArduinoJson 5.x.
    bblanchon/ArduinoJson@^5.13.4
    links2004/WebSockets@2.4.1
    ; Связка как в DED_CORE_LED/SERVO: ElegantOTA 3.x требует ESPAsyncWebServer 3.x.
    mathieucarbou/ESPAsyncWebServer@3.6.0
    mathieucarbou/AsyncTCP@3.3.2
    ayushsharma82/ElegantOTA@3.1.6
    ; Дисплей NV3041A по QSPI + Canvas 480x272.
    moononournation/GFX Library for Arduino@1.4.6
    ; Шрифты U8g2 рисует сам Arduino_GFX (setFont(u8g2_font_...)).
    olikraus/U8g2@^2.35.30
    ; GT911 на I2C.
    https://github.com/mmMicky/TouchLib.git
